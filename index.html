<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Set the theme before first paint to avoid a flash of the wrong colours
      (function () {
        const saved = localStorage.getItem('theme');
        document.documentElement.dataset.theme = saved || 'dark';
      })();
    </script>
    <title>Marie-Ève Noël — Front-end developer</title>
    <meta name="description" content="Marie-Ève Noël is a front-end developer in Montréal who builds the websites AI companies show the world." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
